<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMMY.VIP — Coming Soon</title>
<meta name="description" content="GYMMY.VIP — Coming Soon">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(
      circle at 50% 42%,
      #171717 0%,
      #090909 34%,
      #000000 72%
    ),
    #000000;
  color: #ffffff;
  font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
}

.page {
  width: min(92vw, 900px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 20px;
}

.brand {
  position: relative;
  margin-bottom: 44px;
  letter-spacing: -0.06em;
  font-weight: 900;
  font-size: clamp(58px, 15vw, 128px);
  line-height: .78;
  font-style: italic;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #777777 18%,
    #ffffff 32%,
    #4c4c4c 48%,
    #f7f7f7 62%,
    #777777 78%,
    #ffffff 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 2px 5px rgba(255,255,255,.16));
}

.brand:before,
.brand:after {
  content: "";
  position: absolute;
  height: 5px;
  border-radius: 99px;
  top: 50%;
  width: 34vw;
  max-width: 250px;
  min-width: 85px;

  background: linear-gradient(
    90deg,
    transparent,
    #f7f7f7 30%,
    #777777 50%,
    #ffffff 70%,
    transparent
  );
}

.brand:before {
  right: calc(100% + 22px);
}

.brand:after {
  left: calc(100% + 22px);
}

.coming {
  font-size: clamp(48px, 11vw, 96px);
  line-height: .92;
  letter-spacing: .13em;
  font-weight: 300;
  text-transform: uppercase;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #a9a9a9 22%,
    #f7f7f7 40%,
    #555555 52%,
    #eeeeee 65%,
    #8b8b8b 80%,
    #ffffff 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  text-shadow: 0 2px 20px rgba(255,255,255,.08);
}

.rule {
  width: 92px;
  height: 2px;
  margin: 34px auto 30px;

  background: linear-gradient(
    90deg,
    transparent,
    #aaaaaa,
    #ffffff,
    #aaaaaa,
    transparent
  );

  box-shadow: 0 0 12px rgba(255,255,255,.18);
}

.women {
  font-family: "Brush Script MT", "Segoe Script", cursive;
  font-size: clamp(42px, 10vw, 78px);
  font-weight: 700;
  font-style: italic;
  line-height: 1;

  background: linear-gradient(
    180deg,
    #fff2f5 0%,
    #e8a9b8 20%,
    #ffffff 38%,
    #b45e75 52%,
    #f2c1cd 68%,
    #a44963 82%,
    #ffe8ee 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  opacity: .92;
}

.domain {
  margin-top: 34px;
  font-size: 14px;
  letter-spacing: .52em;
  color: #777777;
  text-transform: uppercase;
}

.note {
  margin-top: 52px;
  font-size: 11px;
  letter-spacing: .28em;
  color: #444444;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  .brand:before {
    right: calc(100% + 12px);
  }

  .brand:after {
    left: calc(100% + 12px);
  }

  .domain {
    letter-spacing: .38em;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="brand" aria-label="GYMMY">
    GYMMY
  </div>

  <div class="coming">
    COMING<br>SOON
  </div>

  <div class="rule"></div>

  <div class="women" aria-label="GYMMY">
    Gymmy
  </div>

  <div class="domain">
    GYMMY.VIP
  </div>

  <div class="note">
    The next level is coming.
  </div>

</main>

</body>
</html>
